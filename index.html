<style>
/* Layout: one fluid sheet, max 1200px. Desktop 48px gutter, tablet (under 1200) 32px,
   phone (under 810) 24px. Hairline rules divide sections; the photographs carry the colour. */
:root {
  --paper: #f5f3ef; --ink: #1f1d1a; --soft: #6b6863; --rule: #dbd8d2; --field: #8a8782; --error: #8f2d1c;

}
html { background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, figure { margin: 0; font-weight: 400; }
h1, h2, h3 { text-wrap: balance; }
a { color: inherit; text-decoration: none; transition: color .2s; }

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

button { font: inherit; color: inherit; }

.sheet { max-width: 1200px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;

#app { flex: 1; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; animation: rise .5s cubic-bezier(.2,.7,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.serif { font-family: var(--serif); letter-spacing: -0.01em; }
.label { font-size: 11px; line-height: 16px; letter-spacing: 0.03em; text-transform: uppercase; }
.soft { color: var(--soft); }
.ph { overflow: hidden; background: var(--rule); min-width: 0; }
.rule-top { border-top: 1px solid var(--rule); }
.rule-bottom { border-bottom: 1px solid var(--rule); }
.underlined { display: inline-block; padding-bottom: 3px; border-bottom: 1px solid var(--rule); }
a:hover .underlined, a.underlined:hover { border-color: var(--ink); color: var(--ink); }
a .ph img { transition: transform 1.2s cubic-bezier(.2,.6,.2,1); }

/* masthead */
.mast { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 22px 20px; border-bottom: 1px solid var(--rule); }

.mast .logo .mono { font-size: 30px; line-height: 1; }

.mast .name { font-size: 26px; line-height: 32px; padding-block: 6px; }
.nav { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }

/* shared blocks */

.cap .t { font-size: 26px; line-height: 33px; }
.eyebrow-title { display: flex; flex-direction: column; gap: 8px; }
.big { font-size: 46px; line-height: 1.1; }

.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 4px 24px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-block: 18px 22px; }
.foot > div { display: flex; align-items: baseline; gap: 12px 24px; flex-wrap: wrap; }

/* series */

.crumb a, .back a { display: inline-block; padding-block: 12px; }
.shead { display: grid; grid-template-columns: 446fr 658fr; align-items: start; padding-bottom: 36px; border-bottom: 1px solid var(--rule); }
.shead .txt { padding: 26px 40px 0 0; display: flex; flex-direction: column; }

.shot { display: block; width: 100%; padding: 0; border: 0; border-radius: 0; background: var(--rule); cursor: zoom-in; overflow: hidden; }

/* editorial */
.ehead { text-align: center; padding-block: 48px 44px; display: grid; gap: 12px; justify-items: center; }
.efirst { display: block; padding-bottom: 48px; border-bottom: 1px solid var(--rule); }
.r-ewide { aspect-ratio: 1104 / 490; }
.erow { display: grid; align-items: center; padding-block: 48px; border-bottom: 1px solid var(--rule); }
.erow.text-first { grid-template-columns: 433fr 671fr; } .erow.text-first .ph { aspect-ratio: 3 / 2; }
.erow.photo-first { grid-template-columns: 442fr 662fr; } .erow.photo-first .ph { aspect-ratio: 4 / 5; } .erow.photo-first .txt { padding-left: 64px; }
.erow .txt { display: grid; gap: 10px; }
.erow h2 { font-size: 36px; line-height: 42px; }
.erow p.lede { max-width: 260px; }
.eabout { display: grid; grid-template-columns: 584fr 520fr; align-items: end; gap: 24px; padding-block: 62px 60px; }
.eabout h2 { font-size: 36px; line-height: 1.1; margin-top: 14px; max-width: 360px; }
.eabout p { max-width: 390px; padding-bottom: 6px; }

/* about, prints details, contact */
.phead { padding-block: 62px 48px; }
.r-me { aspect-ratio: 1; width: 340px; max-width: 100%; }
.split.about { border-top: 1px solid var(--rule, #dbd8d2); }
.split { display: grid; grid-template-columns: 38fr 62fr; padding-block: 64px; align-items: start; }
.split > .label { padding-top: 3px; }
.split .body { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.split .body p { max-width: 520px; }
.split .facts { margin-top: 22px; }
.cta { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 56px; }
.cta h2 { font-size: 36px; line-height: 42px; }
.cta a { padding-block: 11px; }
.contact { display: grid; grid-template-columns: 38fr 51fr; justify-content: space-between; gap: 40px 11%; align-items: start; padding-block: 48px 72px; }
.contact .side { display: flex; flex-direction: column; gap: 28px; max-width: 300px; }
form { display: flex; flex-direction: column; gap: 28px; margin: 0; }
.field { display: flex; flex-direction: column; }
.field input, .field select, .field textarea { width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--field); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; line-height: 1.5; }
.field textarea { resize: vertical; }
.btn { align-self: flex-start; padding: 14px 28px; min-height: 44px; border: 1px solid var(--ink); border-radius: 0; background: var(--ink); color: var(--paper); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.err { color: var(--error); }
.sent { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.sent h2 { font-size: 36px; line-height: 42px; }

/* photo viewer */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(245,243,239,0.98); display: flex; flex-direction: column; animation: lbfade .28s ease-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px)); }
@keyframes lbfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lbrise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.lb .top, .lb .bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.lb .top { border-bottom: 1px solid var(--rule); } .lb .bottom { border-top: 1px solid var(--rule); padding-top: 10px; }
.lb .top .name { font-size: 24px; line-height: 30px; }
.lb .stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding-block: 24px; cursor: zoom-out; }
.lb .stage img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; cursor: default; animation: lbrise .45s cubic-bezier(.2,.7,.2,1);
  box-shadow: 0 30px 70px -28px rgba(31,29,26,0.55), 0 2px 8px rgba(31,29,26,0.12); }
.lb .tbtn { display: flex; align-items: center; gap: 10px; min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer; transition: color .2s; }
.lb .tbtn:hover { color: var(--soft); }
.lb .capt { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }

</style>

    s.photos.forEach((p, i) => { const c = colH.indexOf(Math.min(...colH)); colH[c] += hh(p); colP[c].push([p, i + 1]); });
    /* Even out the column ends: move or swap the last photos of the tallest and shortest columns while that helps. */
    for (let r = 0; r < 40; r++) {
      const t = colH.indexOf(Math.max(...colH)), u = colH.indexOf(Math.min(...colH));
      if (t === u || !colP[t].length) break;
      const a = colP[t][colP[t].length - 1], ha = hh(a[0]), d = colH[t] - colH[u];
      if (ha < d) { colP[u].push(colP[t].pop()); colH[t] -= ha; colH[u] += ha; continue; }
      const b = colP[u][colP[u].length - 1], hb = b ? hh(b[0]) : 0;
      if (b && ha > hb && Math.abs(d - 2 * (ha - hb)) < d - 1e-9) { colP[t][colP[t].length - 1] = b; colP[u][colP[u].length - 1] = a; colH[t] += hb - ha; colH[u] += ha - hb; continue; }
      break;
    }
    colP.forEach((ps, c) => { colHtml[c] = ps.map(([p, i]) => shot(p, false, i)).join(""); });
    return `${mast("gallery")}
    <div class="crumb"><a href="#gallery">All series</a></div>
    <section class="shead">
      <div class="txt"><p class="label">${num(SERIES.indexOf(s) + 1)}</p><h1 class="serif">${s.place}</h1><p class="lede">${s.intro}</p>${s.meta ? `<p class="label soft meta">${s.meta}</p>` : ""}</div>
      ${shot(s.cover, true, 0)}
    </section>
    ${n ? `<h2 class="more-h serif">More from this series</h2>
    <section class="more"><div class="mosaic${n === 1 && s.photos[0].ar < 1 ? " solo-tall" : ""}">${colHtml.map(h => `<div class="mcol">${h}</div>`).join("")}</div></section>` : ""}
    <div class="back"><a href="#gallery">Back to gallery</a></div>
    ${foot()}`;
  },

  home: () => `${mast("", true)}
    <section class="intro">
      <h1 class="serif big">Slowing the world down, long enough to hold a glimmer.</h1>
      <div class="side"><p class="soft">Landscapes, cities, food and people.</p><p class="label">${YEARS}</p></div>
    </section>
    <section class="pair">
      <a href="#${S1.slug}">${ph(S1.cover, "r-lead", true)}<div class="cap"><span class="t serif">${S1.place}</span><span class="label soft">01</span></div></a>
      <a class="b" href="#${S2.slug}">${ph(S2.cover, "r-tall", true)}<div class="cap"><span class="t serif">${S2.place}</span><span class="label soft">02</span></div></a>
    </section>
    <a class="wide" href="#${S3.slug}">${ph(S3.cover, "r-wide")}<div class="cap"><span class="t serif">${S3.place}</span><span class="label soft">03</span></div></a>
    <a class="tail" href="#${S4.slug}"><div class="txt"><span class="label soft">04</span><h2 class="serif">${S4.place}</h2></div>${ph(S4.cover, "r-lead")}</a>
    <section class="about-strip">
      <p class="label">Behind the camera</p>
      <div class="body"><h2 class="serif">I photograph the outdoors, city streets, food and people.</h2><p class="soft">${BIO}</p></div>
    </section>
    ${foot()}`,

  about: () => `${mast("about")}
    <section class="phead eyebrow-title"><p class="label">Behind the camera</p><h1 class="serif big">I photograph the outdoors, city streets, food and people.</h1></section>
    <section class="split about">
      ${ph(P("kevin-lee", "Kevin Lee, smiling, in a white T-shirt"), "r-me", true)}
      <div class="body">
        <p>${BIO}</p>
        <div class="facts">${fact("Based in", "San Francisco")}${fact("Working with", "Fujifilm GFX100S II and X100VI")}${fact("Available for", "Commissions and prints")}${fact("Instagram", `<a href="https://www.instagram.com/justfleeting/" target="_blank" rel="noopener">@justfleeting</a>`)}</div>
      </div>
    </section>
    <section class="cta rule-top"><h2 class="serif">Let’s make something together.</h2><a class="underlined" href="#contact">Get in touch</a></section>
    ${foot()}`,

  prints: () => `${mast("prints")}
    <section class="ghead">
      <div class="eyebrow-title"><p class="label">For the wall</p><h1 class="serif big">Prints</h1></div>
      <p class="lede">Any photograph here can be made as a print. Tell me which one and the size you have in mind, and I’ll reply with the options.</p>
    </section>
    <section class="cards three">
      ${PRINTS.map((p, i) => `<a class="card" href="#contact">${ph(p, "", i < 3)}<span class="label">${p.label}</span><h3 class="serif">${p.title}</h3><span class="underlined">Ask about this print</span></a>`).join("")}
    </section>
    <section class="split rule-top">
      <p class="label" style="padding-top:19px">Print details</p>
      <div class="body"><div class="facts" style="margin-top:0">${fact("Paper", "[YOUR PAPER]")}${fact("Sizes", "[YOUR SIZES]")}${fact("Prices from", "[YOUR PRICE]")}${fact("Shipping", "[YOUR SHIPPING]")}</div></div>
    </section>
    ${foot()}`,

  contact: () => `${mast("contact")}
    <section class="phead eyebrow-title rule-bottom"><p class="label">Inquiries</p><h1 class="serif big">Let’s make something together.</h1></section>
    <section class="contact">
      <div class="side">
        <p>For commissions and prints. Tell me what you have in mind and I’ll write back.</p>
        <div class="facts">${fact("Email", `<a href="mailto:k.hyunlee6@gmail.com">k.hyunlee6@gmail.com</a>`)}${fact("Instagram", `<a href="https://www.instagram.com/justfleeting/" target="_blank" rel="noopener">@justfleeting</a>`)}${fact("Based in", "San Francisco")}</div>
      </div>
      <div class="formwrap" id="formwrap">
        <form id="note" novalidate>
          <div class="field"><label class="label" for="f-name">Name</label><input id="f-name" type="text" autocomplete="name"></div>
          <div class="field"><label class="label" for="f-email">Email</label><input id="f-email" type="email" autocomplete="email"></div>
          <div class="field"><label class="label" for="f-topic">What is it about</label><select id="f-topic"><option>A commission</option><option>A print</option><option>A collaboration</option><option>Something else</option></select></div>
          <div class="field"><label class="label" for="f-message">Message</label><textarea id="f-message" rows="4"></textarea></div>
          <p class="err" id="f-err" role="alert" hidden></p>
          <button class="btn" type="submit">Send note</button>
        </form>
      </div>
    </section>
    ${foot()}`
};

/* routing */
const app = document.getElementById("app");
const phoneMq = matchMedia("(max-width: 809px)");
phoneMq.addEventListener("change", () => { if (current && current.startsWith("series:")) { const y = scrollY; app.innerHTML = `<div class="view">${views.series(bySlug[current.slice(7)])}</div>`; scrollTo(0, y); } });
let current = null, shots = [], shotTitle = "";
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const s = bySlug[h], name = s ? "series" : (views[h] && h !== "series" ? h : "home");
  const key = name + (s ? ":" + s.slug : "");
  if (key === current) return;
  current = key; closeLb();
  app.innerHTML = `<div class="view">${views[name](s)}</div>`;
  shots = s ? [s.cover, ...s.photos] : [];
  shotTitle = s ? num(SERIES.indexOf(s) + 1) : "";
  lbSeries = s ? s.place : "";
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* contact form: checks the fields, but is not connected to email yet */
app.addEventListener("submit", e => {
  if (e.target.id !== "note") return;
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim(), err = document.getElementById("f-err");
  const fail = (msg, id) => { err.textContent = msg; err.hidden = false; document.getElementById(id).focus(); };
  if (!v("f-name")) return fail("Add your name so I know who is writing.", "f-name");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("f-email"))) return fail("Add an email address I can reply to, like name@example.com.", "f-email");
  if (!v("f-message")) return fail("Write a short message before sending.", "f-message");
  document.getElementById("formwrap").innerHTML = `<div class="sent"><h2 class="serif">Thank you, ${esc(v("f-name"))}.</h2>
    <p>This form is not connected to email yet, so nothing was sent. Once it is, your note will go to k.hyunlee6@gmail.com. Until then, please email that address directly.</p>
    <button class="btn ghost" type="button" id="again">Write another note</button></div>`;
});
app.addEventListener("click", e => {
  if (e.target.id === "again") { current = null; route(); return; }
  const b = e.target.closest("[data-shot]");
  if (b) openLb(+b.dataset.shot, b);
});

/* photo viewer */
const lb = document.getElementById("lb");
let lbI = -1, lbFrom = null, lbSeries = "";
const ICON = { x: '<path d="M4 4l10 10M14 4L4 14"/>', l: '<path d="M16 9H2.5M7 4L2 9l5 5"/>', r: '<path d="M2 9h13.5M11 4l5 5-5 5"/>' };
const svg = k => `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">${ICON[k]}</svg>`;
function drawLb() {
  const p = shots[lbI];
  lb.innerHTML = `
    <div class="top"><span class="name serif mono" role="img" aria-label="Kevin Lee">${MONO}</span><button type="button" class="tbtn" data-lb="close">Close ${svg("x")}</button></div>
    <div class="stage" data-lb="close"><img src="${p.src}" alt="${esc(p.alt)}"></div>
    <div class="bottom">
      <button type="button" class="tbtn" data-lb="prev" aria-label="Previous photo">${svg("l")}<span class="word">Previous</span></button>
      <div class="capt"><span class="t serif">${lbSeries}</span><span class="label soft">${shotTitle} · ${lbI + 1} / ${shots.length}</span></div>
      <button type="button" class="tbtn" data-lb="next" aria-label="Next photo"><span class="word">Next</span>${svg("r")}</button>
    </div>`;
}
function openLb(i, from) { lbI = i; lbFrom = from; drawLb(); lb.hidden = false; document.documentElement.style.overflow = "hidden"; lb.querySelector('[data-lb="close"]').focus(); }
function closeLb() { if (lb.hidden) return; lb.hidden = true; lb.innerHTML = ""; document.documentElement.style.overflow = ""; if (lbFrom && lbFrom.isConnected) lbFrom.focus(); lbFrom = null; }
function stepLb(d) { lbI = (lbI + d + shots.length) % shots.length; drawLb(); lb.querySelector(`[data-lb="${d < 0 ? "prev" : "next"}"]`).focus(); }
lb.addEventListener("click", e => {
  if (e.target.tagName === "IMG") return;
  const a = e.target.closest("[data-lb]"); if (!a) return;
  a.dataset.lb === "close" ? closeLb() : stepLb(a.dataset.lb === "prev" ? -1 : 1);
});
lb.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") stepLb(-1); else if (e.key === "ArrowRight") stepLb(1);
  else if (e.key === "Tab") { const f = [...lb.querySelectorAll("button")], i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
});
let tx = null;
lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(d) > 50) stepLb(d > 0 ? -1 : 1); }, { passive: true });

route();
</script>
</body>
</html>
