<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kevin Lee Photography</title>
<meta name="description" content="Photographs by Kevin Lee: the outdoors, city streets, food and people.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Geist:wght@400&family=Italiana&display=swap">
<style>
/* Layout: one fluid sheet, max 1200px. Desktop 48px gutter, tablet (under 1200) 32px,
   phone (under 810) 24px. Hairline rules divide sections; the photographs carry the colour. */
:root {
  --paper: #f5f3ef; --ink: #1f1d1a; --soft: #6b6863; --rule: #dbd8d2; --field: #8a8782; --error: #8f2d1c;
  --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter: 48px; --gap: 24px;
}
html { background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, figure { margin: 0; font-weight: 400; }
h1, h2, h3 { text-wrap: balance; }
a { color: inherit; text-decoration: none; transition: color .2s; }
a:hover { color: var(--soft); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
button { font: inherit; color: inherit; }

.sheet { max-width: 1200px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
#app { flex: 1; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; animation: rise .5s cubic-bezier(.2,.7,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.serif { font-family: var(--serif); letter-spacing: -0.01em; }
.label { font-size: 11px; line-height: 16px; letter-spacing: 0.03em; text-transform: uppercase; }
.soft { color: var(--soft); }
.ph { overflow: hidden; background: var(--rule); min-width: 0; }
.rule-top { border-top: 1px solid var(--rule); }
.rule-bottom { border-bottom: 1px solid var(--rule); }
.underlined { display: inline-block; padding-bottom: 3px; border-bottom: 1px solid var(--rule); }
a:hover .underlined, a.underlined:hover { border-color: var(--ink); color: var(--ink); }
a .ph img { transition: transform 1.2s cubic-bezier(.2,.6,.2,1); }
a:hover .ph img { transform: scale(1.02); }

/* masthead */
.mast { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 22px 20px; border-bottom: 1px solid var(--rule); }
.mono { display: inline-flex; align-items: center; font-weight: 300; letter-spacing: 0; }
.mono .bar { width: 1px; height: .95em; background: currentColor; transform: rotate(18deg); margin: 0 .2em 0 .22em; }
.mono em { font-style: italic; }
.mast .logo { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.mast .logo .mono { font-size: 30px; line-height: 1; }
.mast .logo .sub { font-family: "Italiana", var(--serif); display: block; font-size: 11px; line-height: 16px; letter-spacing: .42em; margin-right: -.42em; text-transform: uppercase; }
.mast .name { font-size: 26px; line-height: 32px; padding-block: 6px; }
.nav { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.nav a { padding-block: 11px; }
.nav a[aria-current="page"] { border-bottom: 1px solid var(--ink); padding-bottom: 10px; }

/* shared blocks */
.cap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 14px; }
.cap .t { font-size: 26px; line-height: 33px; }
.eyebrow-title { display: flex; flex-direction: column; gap: 8px; }
.big { font-size: 46px; line-height: 1.1; }
.facts { display: flex; flex-direction: column; border-bottom: 1px solid var(--rule); }
.facts a { border-bottom: 1px solid var(--rule); padding-bottom: 2px; } .facts a:hover { border-color: var(--ink); color: var(--ink); }
.facts > div { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 24px; flex-wrap: wrap; padding-block: 16px; border-top: 1px solid var(--rule); }
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 4px 24px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-block: 18px 22px; }
.foot > div { display: flex; align-items: baseline; gap: 12px 24px; flex-wrap: wrap; }
.foot a { display: inline-block; padding-block: 12px; }
.foot .inq { gap: 12px; }

/* home */
.intro { display: grid; grid-template-columns: 59fr 41fr; padding-block: 64px 58px; align-items: start; }
.intro .side { padding-top: 6px; display: grid; gap: 16px; max-width: 290px; }
.pair { display: grid; grid-template-columns: 652fr 404fr; gap: 48px; align-items: start; }
.pair .b { margin-top: 120px; }
.r-lead { aspect-ratio: 652 / 479; } .r-tall { aspect-ratio: 404 / 422; } .r-wide { aspect-ratio: 1104 / 590; }
.wide { display: block; margin-top: 52px; }
.tail { display: grid; grid-template-columns: 404fr 652fr; gap: 48px; align-items: end; margin-top: 52px; }
.tail .txt { display: grid; gap: 10px; padding-bottom: 6px; }
.tail h2 { font-size: 36px; line-height: 42px; }
.about-strip { display: grid; grid-template-columns: 38fr 62fr; padding-block: 84px 72px; align-items: start; }
.about-strip h2 { font-size: 36px; line-height: 1.15; }
.about-strip .body { display: grid; gap: 18px; max-width: 684px; }
.about-strip .label { padding-top: 6px; }

/* gallery and prints */
.ghead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px 48px; flex-wrap: wrap; padding-block: 62px 40px; }
.ghead p.lede { max-width: 310px; padding-top: 12px; }
.cards { display: grid; gap: 40px var(--gap); border-top: 1px solid var(--rule); padding-block: 18px 56px; }
.cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.card .ph { width: 100%; aspect-ratio: 3 / 2; }
.cards.three .card .ph { aspect-ratio: 4 / 3; }
.card .label { margin-top: 18px; }
.card h3 { font-size: 26px; line-height: 33px; margin-top: 8px; }
.card .underlined { margin-top: 18px; }
.pgroup { display: grid; grid-template-columns: 352fr 728fr; gap: var(--gap); align-items: start; border-top: 1px solid var(--rule); padding-block: 28px 36px; }
.ptxt { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.ptxt h2 { font-size: 30px; line-height: 36px; }
.ptxt .underlined { margin-top: 6px; }
.pcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px var(--gap); }
.pcards .card .ph { aspect-ratio: 4 / 3; }
.pcards .card h3 { margin-top: 16px; }
.pcards .card .underlined { margin-top: 12px; }

/* series */
.crumb { padding-block: 28px 18px; }
.crumb a, .back a { display: inline-block; padding-block: 12px; }
.shead { display: grid; grid-template-columns: 446fr 658fr; align-items: start; padding-bottom: 36px; border-bottom: 1px solid var(--rule); }
.shead .txt { padding: 26px 40px 0 0; display: flex; flex-direction: column; }
.shead h1 { font-size: 52px; line-height: 1.04; margin-top: 12px; max-width: 320px; }
.shead .lede { margin-top: 20px; max-width: 290px; }
.shead .meta { margin-top: 16px; max-width: 320px; }
.shot { display: block; width: 100%; padding: 0; border: 0; border-radius: 0; background: var(--rule); cursor: zoom-in; overflow: hidden; }
.shot img { transition: transform 1.2s cubic-bezier(.2,.6,.2,1); }
.shot:hover img { transform: scale(1.02); }
.shead .shot { aspect-ratio: var(--ar); }
.more-h { font-size: 30px; line-height: 36px; padding-block: 28px 22px; }
.more { display: flex; flex-direction: column; gap: var(--gap); padding-bottom: 36px; border-bottom: 1px solid var(--rule); }
.mosaic { display: flex; gap: var(--gap); align-items: flex-start; }
.mosaic.solo-tall { max-width: 50%; }
.mcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
.mosaic .shot { aspect-ratio: var(--ar); }
.back { padding-block: 14px 34px; }

/* editorial */
.ehead { text-align: center; padding-block: 48px 44px; display: grid; gap: 12px; justify-items: center; }
.ehead h1 { max-width: 640px; text-wrap: balance; } .ehead p:last-child { max-width: 460px; }
.esec { padding-block: 48px; border-bottom: 1px solid var(--rule); }
.etxt { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 28px; }
.etxt h2 { font-size: 36px; line-height: 42px; } .etxt p { max-width: 440px; } .etxt .underlined { margin-top: 4px; }
.esec a { display: block; min-width: 0; }
.e3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); margin-top: 36px; } .e3 .ph { aspect-ratio: 3 / 2; }
.e4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); } .e4.tall .ph { aspect-ratio: 3 / 4; } .e4.sq .ph { aspect-ratio: 1; }
.efirst { display: block; padding-bottom: 48px; border-bottom: 1px solid var(--rule); }
.r-ewide { aspect-ratio: 1104 / 490; }
.erow { display: grid; align-items: center; padding-block: 48px; border-bottom: 1px solid var(--rule); }
.erow.text-first { grid-template-columns: 433fr 671fr; } .erow.text-first .ph { aspect-ratio: 3 / 2; }
.erow.photo-first { grid-template-columns: 442fr 662fr; } .erow.photo-first .ph { aspect-ratio: 4 / 5; } .erow.photo-first .txt { padding-left: 64px; }
.erow .txt { display: grid; gap: 10px; }
.erow h2 { font-size: 36px; line-height: 42px; }
.erow p.lede { max-width: 260px; }
.eabout { display: grid; grid-template-columns: 584fr 520fr; align-items: end; gap: 24px; padding-block: 62px 60px; }
.eabout h2 { font-size: 36px; line-height: 1.1; margin-top: 14px; max-width: 360px; }
.eabout p { max-width: 390px; padding-bottom: 6px; }

/* about, prints details, contact */
.phead { padding-block: 62px 48px; }
.r-me { aspect-ratio: 1; width: 340px; max-width: 100%; }
.split.about { border-top: 1px solid var(--rule, #dbd8d2); }
.split { display: grid; grid-template-columns: 38fr 62fr; padding-block: 64px; align-items: start; }
.split > .label { padding-top: 3px; }
.split .body { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.split .body p { max-width: 520px; }
.split .facts { margin-top: 22px; } .split .body > .facts:first-child { margin-top: 0; }
.cta { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 56px; }
.cta h2 { font-size: 36px; line-height: 42px; }
.cta a { padding-block: 11px; }
.contact { display: grid; grid-template-columns: 38fr 51fr; justify-content: space-between; gap: 40px 11%; align-items: start; padding-block: 48px 72px; }
.contact .side { display: flex; flex-direction: column; gap: 28px; max-width: 300px; }
form { display: flex; flex-direction: column; gap: 28px; margin: 0; }
.field { display: flex; flex-direction: column; }
.field input, .field select, .field textarea { width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--field); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; line-height: 1.5; }
.field textarea { resize: vertical; }
.btn { align-self: flex-start; padding: 14px 28px; min-height: 44px; border: 1px solid var(--ink); border-radius: 0; background: var(--ink); color: var(--paper); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.err { color: var(--error); }
.sent { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.sent h2 { font-size: 36px; line-height: 42px; }

/* photo viewer */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(245,243,239,0.98); display: flex; flex-direction: column; animation: lbfade .28s ease-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px)); }
@keyframes lbfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lbrise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.lb .top, .lb .bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.lb .top { border-bottom: 1px solid var(--rule); } .lb .bottom { border-top: 1px solid var(--rule); padding-top: 10px; }
.lb .top .name { font-size: 24px; line-height: 30px; }
.lb .stage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding-block: 24px; cursor: zoom-out; }
.lb .stage img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; cursor: default; animation: lbrise .45s cubic-bezier(.2,.7,.2,1);
  box-shadow: 0 30px 70px -28px rgba(31,29,26,0.55), 0 2px 8px rgba(31,29,26,0.12); }
.lb .tbtn { display: flex; align-items: center; gap: 10px; min-height: 44px; min-width: 44px; padding: 0; border: 0; background: none; cursor: pointer; transition: color .2s; }
.lb .tbtn:hover { color: var(--soft); }
.lb .capt { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.lb .capt .t { font-size: 24px; line-height: 30px; }

@media (prefers-reduced-motion: reduce) { .view, .lb, .lb .stage img { animation: none; } a .ph img, .shot img { transition: none; } }

/* tablet */
@media (max-width: 1199px) {
  :root { --gutter: 32px; --gap: 18px; }
  .big { font-size: 42px; }
  .intro { grid-template-columns: 58fr 42fr; align-items: center; padding-block: 56px 48px; }
  .pair { grid-template-columns: 441fr 273fr; gap: 32px; }
  .pair .b { margin-top: 16%; } .r-tall { aspect-ratio: 3 / 4; }
  .wide { margin-top: 44px; } .r-wide { aspect-ratio: 746 / 364; }
  .tail { grid-template-columns: 273fr 441fr; gap: 32px; margin-top: 44px; } .tail h2 { font-size: 34px; line-height: 40px; }
  .about-strip { grid-template-columns: 36fr 64fr; padding-block: 72px 64px; }
  .ghead { padding-block: 52px 36px; }
  .cards { gap: 28px var(--gap); padding-bottom: 40px; }
  .card h3 { font-size: 23px; line-height: 29px; }
  .shead { grid-template-columns: 294fr 452fr; padding-bottom: 32px; }
  .shead .txt { padding-right: 36px; }
  .shead h1 { font-size: 40px; }
  .more-h { font-size: 28px; }
  .erow { padding-block: 44px; }
  .erow.text-first { grid-template-columns: 286fr 460fr; }
  .erow.photo-first { grid-template-columns: 300fr 446fr; } .erow.photo-first .txt { padding-left: 40px; }
  .erow h2 { font-size: 34px; line-height: 40px; }
  .r-ewide { aspect-ratio: 746 / 350; } .r-me { width: 200px; }
  .eabout { grid-template-columns: 390fr 356fr; padding-block: 56px 52px; }
  .phead { padding-block: 52px 40px; }
  .split { grid-template-columns: 31fr 69fr; padding-block: 56px; }
  .cta { padding-block: 40px; } .cta h2, .sent h2 { font-size: 34px; line-height: 40px; }
  .contact { grid-template-columns: 270fr 420fr; gap: 40px 56px; padding-block: 40px 56px; }
}

/* phone */
@media (max-width: 809px) {
  :root { --gutter: 24px; --gap: 16px; }
  .mast { padding-block: 12px 10px; } .mast .name { font-size: 24px; line-height: 30px; }
  .nav { gap: 14px; } .nav .role { display: none; }
  .big { font-size: 40px; }
  .intro { grid-template-columns: 1fr; row-gap: 24px; padding-block: 40px; }
  .intro .side { max-width: none; padding-top: 0; gap: 18px; }
  .intro .side p:first-child, .lede, .split .body p, .about-strip .body p, .eabout p, .contact .side > p, .sent p { line-height: 24px; }
  .pair { grid-template-columns: 1fr; gap: 40px; } .pair .b { margin-top: 0; }
  .wide { margin-top: 40px; } .r-wide { aspect-ratio: 342 / 167; }
  .cap .t { font-size: 24px; line-height: 30px; }
  .tail { grid-template-columns: 1fr; gap: 14px; margin-top: 40px; } .tail .txt { order: 2; gap: 6px; padding-bottom: 0; } .tail h2 { font-size: 24px; line-height: 30px; }
  .about-strip { grid-template-columns: 1fr; row-gap: 28px; padding-block: 56px 44px; }
  .about-strip h2, .eabout h2 { font-size: 34px; }
  .ghead { flex-direction: column; gap: 14px; padding-block: 40px 32px; }
  .ghead p.lede { padding-top: 0; }
  .cards.two { grid-template-columns: 1fr; gap: 28px; padding-block: 16px 36px; }
  .cards.three { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; padding-block: 16px 36px; }
  .cards.two .card .ph { aspect-ratio: 5 / 4; }
  .cards.three .card h3 { font-size: 21px; line-height: 26px; }
  .card .label { margin-top: 14px; } .card .underlined { margin-top: 6px; padding-block: 11px; }
  .crumb { padding-block: 16px 10px; }
  .shead { grid-template-columns: 1fr; padding-bottom: 24px; }
  .pgroup { grid-template-columns: 1fr; row-gap: 18px; padding-block: 24px 28px; } .ptxt h2 { font-size: 26px; line-height: 32px; } .pcards { gap: 24px 14px; } .pcards .card h3 { font-size: 21px; line-height: 28px; }
  .shead .txt { padding: 0 0 24px; }
  .shead h1 { margin-top: 10px; max-width: 280px; } .shead .lede { margin-top: 14px; max-width: 310px; }
  .more-h { padding-block: 24px 18px; }
  .more { padding-bottom: 20px; }
  .mosaic, .mcol { gap: 14px; } .mosaic.solo-tall { max-width: none; }
  .back { padding-block: 10px 22px; }
  .ehead { padding-block: 36px; gap: 10px; } .ehead .big { font-size: 36px; }
  .mast .logo .sub { letter-spacing: .26em; margin-right: -.26em; }
  .esec { padding-block: 36px; } .etxt { margin-bottom: 24px; } .etxt h2 { font-size: 30px; line-height: 36px; } .etxt p { line-height: 24px; }
  .e3 { grid-template-columns: 1fr; gap: 16px; margin-top: 16px; } .e4 { grid-template-columns: 1fr 1fr; gap: 16px; } .r-ewide { aspect-ratio: 3 / 2; }
  .efirst { padding-bottom: 36px; } .r-ewide { aspect-ratio: 3 / 2; } .r-me { width: 100%; }
  .erow, .erow.text-first, .erow.photo-first { grid-template-columns: 1fr; row-gap: 20px; padding-block: 24px 32px; }
  .erow.text-first .txt { order: 2; } .erow.photo-first .txt { padding-left: 0; }
  .erow h2 { font-size: 30px; line-height: 36px; }
  .eabout { grid-template-columns: 1fr; row-gap: 20px; padding-block: 36px 44px; }
  .phead { padding-block: 40px 32px; } .phead .big { font-size: 34px; }

  .foot { flex-direction: column; align-items: flex-start; padding-block: 16px; }
  .lb .top .name { font-size: 22px; } .lb .stage { padding-block: 18px; }

}
</style>

<body>
<div class="sheet"><div id="app"></div></div>
<div id="lb" class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden></div>

<script>
const P = (file, alt, ar, place) => ({ src: "img/" + file + ".jpg", alt, ar, place });
const SERIES = [
  { slug: "outdoors", place: "The Great Outdoors",

      ${home ? `<span class="label role">Travel and lifestyle photographer</span>` : ""}
      ${[["gallery", "Gallery"], ["prints", "Prints"], ["about", "About"], ["contact", "Contact"]].map(([h, t]) => `<a href="#${h}"${cur === h ? ' aria-current="page"' : ""}>${t}</a>`).join("")}
    </nav>
  </header>`;
const foot = () => `
  <footer class="foot">
    <div class="inq"><span class="label">Inquiries</span><a href="#contact">Write to me</a></div>
    <div><span class="label">© 2026 Kevin Lee</span></div>
  </footer>`;
const fact = (k, v) => `<div><span class="label">${k}</span><span>${v}</span></div>`;

const views = {
  gallery: () => `${mast("gallery")}
    <section class="ghead">
      <div class="eyebrow-title"><p class="label">${YEARS}</p><h1 class="serif big">Gallery</h1></div>
      <p class="lede">Four series, sorted by what is in the frame.</p>
    </section>
    <section class="cards two">
      ${SERIES.map((s, i) => `<a class="card" href="#${s.slug}">${ph(s.cover, "", i < 2)}<span class="label">${num(i + 1)}</span><h3 class="serif">${s.place}</h3><span class="underlined">View series</span></a>`).join("")}
    </section>
    ${foot()}`,

  series: s => {
    /* Columns adapt to the number of photos: up to four sit in one row, more run in three columns (two on a phone). Each photo goes to the shortest column. */
    const n = s.photos.length, cols = phoneMq.matches ? Math.min(n, 2) : (n <= 4 ? n : 3);
    const colH = Array(cols).fill(0), colHtml = Array(cols).fill("");
    const shot = (p, eager, i) => `<button type="button" class="shot" data-shot="${i}" style="--ar: ${p.ar || 1.5}" aria-label="View larger: ${esc(p.alt)}"><img src="${p.src}" alt="${esc(p.alt)}" loading="${eager ? "eager" : "lazy"}"></button>`;
    const hh = p => 1 / (p.ar || 1.5) + 0.04, colP = colH.map(() => []);
    s.photos.forEach((p, i) => { const c = colH.indexOf(Math.min(...colH)); colH[c] += hh(p); colP[c].push([p, i + 1]); });
    /* Even out the column ends: move or swap the last photos of the tallest and shortest columns while that helps. */
    for (let r = 0; r < 40; r++) {
      const t = colH.indexOf(Math.max(...colH)), u = colH.indexOf(Math.min(...colH));
      if (t === u || !colP[t].length) break;
      const a = colP[t][colP[t].length - 1], ha = hh(a[0]), d = colH[t] - colH[u];
      if (ha < d) { colP[u].push(colP[t].pop()); colH[t] -= ha; colH[u] += ha; continue; }
      const b = colP[u][colP[u].length - 1], hb = b ? hh(b[0]) : 0;
      if (b && ha > hb && Math.abs(d - 2 * (ha - hb)) < d - 1e-9) { colP[t][colP[t].length - 1] = b; colP[u][colP[u].length - 1] = a; colH[t] += hb - ha; colH[u] += ha - hb; continue; }
      break;
    }
    colP.forEach((ps, c) => { colHtml[c] = ps.map(([p, i]) => shot(p, false, i)).join(""); });
    return `${mast("gallery")}
    <div class="crumb"><a href="#gallery">All series</a></div>
    <section class="shead">
      <div class="txt"><p class="label">${num(SERIES.indexOf(s) + 1)}</p><h1 class="serif">${s.place}</h1><p class="lede">${s.intro}</p>${s.meta ? `<p class="label soft meta">${s.meta}</p>` : ""}</div>
      ${shot(s.cover, true, 0)}
    </section>
    ${n ? `<h2 class="more-h serif">More from this series</h2>
    <section class="more"><div class="mosaic${n === 1 && s.photos[0].ar < 1 ? " solo-tall" : ""}">${colHtml.map(h => `<div class="mcol">${h}</div>`).join("")}</div></section>` : ""}
    <div class="back"><a href="#gallery">Back to gallery</a></div>
    ${foot()}`;
  },

  home: () => `${mast("")}
    <section class="ehead rule-bottom">
      <p class="label">${YEARS}</p>
      <h1 class="serif big">Capturing the fleeting moments.</h1>
      <p>Landscapes, cities, food and people.</p>
    </section>
    ${HOME.map((g, i) => { const s = SERIES[i], ps = g.alts.map(byAlt), link = (p, cls, eager, pos) => `<a href="#${s.slug}">${ph(p, cls, eager, pos)}</a>`;
      return `<section class="esec">
      <div class="etxt"><span class="label">${num(i + 1)}</span><h2 class="serif">${s.place}</h2><p class="soft">${s.intro}</p><a class="underlined" href="#${s.slug}">View series</a></div>
      ${g.kind === "big3" ? `${link(ps[0], "r-ewide", true, g.pos)}<div class="e3">${ps.slice(1).map(p => link(p, "")).join("")}</div>`
        : g.kind === "big" ? link(ps[0], "r-ewide")
        : `<div class="e4 ${g.kind === "tall4" ? "tall" : "sq"}">${ps.map(p => link(p, "")).join("")}</div>`}
    </section>`; }).join("")}
    <section class="about-strip">
      <p class="label">Behind the camera</p>
      <div class="body"><h2 class="serif">I photograph the outdoors, city streets, food and people.</h2><p class="soft">${BIO}</p></div>
    </section>
    ${foot()}`,

  about: () => `${mast("about")}
    <section class="phead eyebrow-title"><p class="label">Behind the camera</p><h1 class="serif big">Kevin Lee</h1></section>
    <section class="split about">
      ${ph(P("kevin-lee", "Kevin Lee, smiling, in a white T-shirt"), "r-me", true)}
      <div class="body">
        <p>I photograph the outdoors, city streets, food and people.</p>
        <div class="facts">${fact("Based in", "San Francisco")}${fact("Available for", "Commissions and prints")}${fact("Instagram", `<a href="https://www.instagram.com/justfleeting/" target="_blank" rel="noopener">@justfleeting</a>`)}</div>
      </div>
    </section>
    <section class="cta rule-top"><h2 class="serif">Let’s make something together.</h2><a class="underlined" href="#contact">Get in touch</a></section>
    ${foot()}`,

  prints: () => `${mast("prints")}
    <section class="ghead">
      <div class="eyebrow-title"><p class="label">For the wall</p><h1 class="serif big">Prints</h1></div>
    </section>
    ${PRINTS.map((g, i) => `<section class="pgroup">
      <div class="ptxt"><span class="label">${num(i + 1)}</span><h2 class="serif">${g.series.place}</h2><a class="underlined" href="#${g.series.slug}">View the full series</a></div>
      <div class="pcards">${g.items.map(p => `<a class="card" href="#contact">${ph(p, "", i < 1)}<h3 class="serif">${p.title}</h3><span class="underlined">Ask about this print</span></a>`).join("")}</div>
    </section>`).join("")}
    ${foot()}`,

  contact: () => `${mast("contact")}
    <section class="phead eyebrow-title rule-bottom"><p class="label">Inquiries</p><h1 class="serif big">Let’s make something together.</h1></section>
    <section class="contact">
      <div class="side">
        <p>For commissions and prints. Tell me what you have in mind and I’ll write back.</p>
        <div class="facts">${fact("Email", `<a href="mailto:k.hyunlee6@gmail.com">k.hyunlee6@gmail.com</a>`)}${fact("Instagram", `<a href="https://www.instagram.com/justfleeting/" target="_blank" rel="noopener">@justfleeting</a>`)}${fact("Based in", "San Francisco")}</div>
      </div>
      <div class="formwrap" id="formwrap">
        <form id="note" novalidate>
          <div class="field"><label class="label" for="f-name">Name</label><input id="f-name" type="text" autocomplete="name"></div>
          <div class="field"><label class="label" for="f-email">Email</label><input id="f-email" type="email" autocomplete="email"></div>
          <div class="field"><label class="label" for="f-topic">What is it about</label><select id="f-topic"><option>A commission</option><option>A print</option><option>A collaboration</option><option>Something else</option></select></div>
          <div class="field"><label class="label" for="f-message">Message</label><textarea id="f-message" rows="4"></textarea></div>
          <p class="err" id="f-err" role="alert" hidden></p>
          <button class="btn" type="submit">Send note</button>
        </form>
      </div>
    </section>
    ${foot()}`
};

/* routing */
const app = document.getElementById("app");
const phoneMq = matchMedia("(max-width: 809px)");
phoneMq.addEventListener("change", () => { if (current && current.startsWith("series:")) { const y = scrollY; app.innerHTML = `<div class="view">${views.series(bySlug[current.slice(7)])}</div>`; scrollTo(0, y); } });
let current = null, shots = [], shotTitle = "";
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const s = bySlug[h], name = s ? "series" : (views[h] && h !== "series" ? h : "home");
  const key = name + (s ? ":" + s.slug : "");
  if (key === current) return;
  current = key; closeLb();
  app.innerHTML = `<div class="view">${views[name](s)}</div>`;
  shots = s ? [s.cover, ...s.photos] : [];
  shotTitle = s ? num(SERIES.indexOf(s) + 1) : "";
  lbSeries = s ? s.place : "";
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* contact form: checks the fields, but is not connected to email yet */
app.addEventListener("submit", e => {
  if (e.target.id !== "note") return;
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim(), err = document.getElementById("f-err");
  const fail = (msg, id) => { err.textContent = msg; err.hidden = false; document.getElementById(id).focus(); };
  if (!v("f-name")) return fail("Add your name so I know who is writing.", "f-name");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("f-email"))) return fail("Add an email address I can reply to, like name@example.com.", "f-email");
  if (!v("f-message")) return fail("Write a short message before sending.", "f-message");
  document.getElementById("formwrap").innerHTML = `<div class="sent"><h2 class="serif">Thank you, ${esc(v("f-name"))}.</h2>
    <p>This form is not connected to email yet, so nothing was sent. Once it is, your note will go to k.hyunlee6@gmail.com. Until then, please email that address directly.</p>
    <button class="btn ghost" type="button" id="again">Write another note</button></div>`;
});
app.addEventListener("click", e => {
  if (e.target.id === "again") { current = null; route(); return; }
  const b = e.target.closest("[data-shot]");
  if (b) openLb(+b.dataset.shot, b);
});

/* photo viewer */
const lb = document.getElementById("lb");
let lbI = -1, lbFrom = null, lbSeries = "";
const ICON = { x: '<path d="M4 4l10 10M14 4L4 14"/>', l: '<path d="M16 9H2.5M7 4L2 9l5 5"/>', r: '<path d="M2 9h13.5M11 4l5 5-5 5"/>' };
const svg = k => `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">${ICON[k]}</svg>`;
function drawLb() {
  const p = shots[lbI];
  lb.innerHTML = `
    <div class="top"><span class="name serif mono" role="img" aria-label="justfleeting">${MONO}</span><button type="button" class="tbtn" data-lb="close">Close ${svg("x")}</button></div>
    <div class="stage" data-lb="close"><img src="${p.src}" alt="${esc(p.alt)}"></div>
    <div class="bottom">
      <button type="button" class="tbtn" data-lb="prev" aria-label="Previous photo">${svg("l")}<span class="word">Previous</span></button>
      <div class="capt"><span class="t serif">${shots[lbI].place || lbSeries}</span><span class="label soft">${lbSeries} · ${lbI + 1} / ${shots.length}</span></div>
      <button type="button" class="tbtn" data-lb="next" aria-label="Next photo"><span class="word">Next</span>${svg("r")}</button>
    </div>`;
}
function openLb(i, from) { lbI = i; lbFrom = from; drawLb(); lb.hidden = false; document.documentElement.style.overflow = "hidden"; lb.querySelector('[data-lb="close"]').focus(); }
function closeLb() { if (lb.hidden) return; lb.hidden = true; lb.innerHTML = ""; document.documentElement.style.overflow = ""; if (lbFrom && lbFrom.isConnected) lbFrom.focus(); lbFrom = null; }
function stepLb(d) { lbI = (lbI + d + shots.length) % shots.length; drawLb(); lb.querySelector(`[data-lb="${d < 0 ? "prev" : "next"}"]`).focus(); }
lb.addEventListener("click", e => {
  if (e.target.tagName === "IMG") return;
  const a = e.target.closest("[data-lb]"); if (!a) return;
  a.dataset.lb === "close" ? closeLb() : stepLb(a.dataset.lb === "prev" ? -1 : 1);
});
lb.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") stepLb(-1); else if (e.key === "ArrowRight") stepLb(1);
  else if (e.key === "Tab") { const f = [...lb.querySelectorAll("button")], i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
});
let tx = null;
lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(d) > 50) stepLb(d > 0 ? -1 : 1); }, { passive: true });

route();
</script>
</body>
</html>
